[project]
name = "bridgewire-access-control"
version = "0.2.0"
description = "Simulator-first replacement for the Bridgewire access-control service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Joe Mienko", email = "joseph.mienko@gmail.com" }]
dependencies = [
    "jsonschema>=4.25,<5",
]

[project.scripts]
bridgewire = "bridgewire.cli:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "bridgewire", from = "src" }]

[tool.poetry.group.dev.dependencies]
mypy = "^1.18"
pytest = "^8.4"
pytest-cov = "^7.0"
ruff = "^0.14"
python-semantic-release = "^10.5"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: tests involving multiple components",
    "failure_mode: simulated operational failure tests",
    "hardware: tests requiring Raspberry Pi hardware",
]

[tool.coverage.run]
branch = true
source = ["bridgewire"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
tag_format = "v{version}"
commit_parser = "conventional"
build_command = "poetry build"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
