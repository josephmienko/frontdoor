[reader]
by_id_path = "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
vid = 6790
pid = 29987

[serial]
baud_rate = 9600
data_bits = 8
parity = "none"
stop_bits = 1
timeout_seconds = 1.0
maximum_record_bytes = 16

[gpio]
numbering = "BCM"
channel = 23
normal_high = false
release_high = true
release_seconds = 3.0

[relay]
backend = "raspberry_pi"

[api]
enabled = false
host = "127.0.0.1"
port = 8080
max_event_page_size = 100
operational_snapshot_stale_after_seconds = 10.0

[reconnect]
minimum_seconds = 1.0
maximum_seconds = 30.0
jitter = 0.0

[escalation]
warning_count = 3
warning_window_seconds = 60.0
critical_count = 5
critical_window_seconds = 300.0
reset_after_seconds = 900.0
