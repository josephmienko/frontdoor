name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry==2.4.1
      - run: poetry install --with dev
      - run: poetry run ruff format --check .
      - run: poetry run ruff check .
      - run: poetry run mypy .
      - run: poetry run pytest --cov=bridgewire --cov-branch --cov-report=term-missing
      - run: poetry build
      - run: docker build .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry==2.4.1
      - run: pipx install python-semantic-release==10.5.2
      - run: semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
